name: Update local news and jobs
on:
  schedule:
    - cron: '17 22 * * *' # 日本時間 07:17
    - cron: '43 23 * * *' # 予備：日本時間 08:43
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: local-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search and summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        # 予備の予約実行は、同じ日本日付ですでに検索予約済みならAPIを呼ばず公開のみ。
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          budget = Path('job-search-budget.json')
          state = json.loads(budget.read_text()) if budget.exists() else {}
          today = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          if state.get('date') == today and state.get('reserved', 0) >= 2:
              print('Daily job search limit reached; publish existing data without extra API calls.')
          else:
              subprocess.run(['python', 'scripts/update_local.py'], check=True)
          PY
          else
            python scripts/update_local.py
          fi
      - name: Save updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Higashirinkan news and jobs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p public
          cp *.html *.css *.js local-updates.json public/
          cp -r assets public/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
    environment:
      name: github-pages
