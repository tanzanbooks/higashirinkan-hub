name: Update local news and jobs
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: local-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search and summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/update_local.py
      - name: Save updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Higashirinkan news and jobs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public files
        run: |
          mkdir -p public
          cp *.html *.css *.js local-updates.json public/
          cp -r assets public/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
    environment:
      name: github-pages
